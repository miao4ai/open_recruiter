name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # ── Step 1: Build frontend ──────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: product/frontend
        run: npm install

      - name: Build frontend
        working-directory: product/frontend
        run: npm run build

      # ── Step 2: Install backend dependencies ────────────────────────────
      # Embeddings run in the Voyage cloud — no local model to export.
      - name: Install backend dependencies
        working-directory: product/backend
        run: uv sync

      # ── Step 3: Bundle backend with PyInstaller ─────────────────────────
      - name: Bundle backend with PyInstaller
        working-directory: product/backend
        run: uv run pyinstaller open_recruiter.spec --noconfirm

      - name: Verify PyInstaller output
        shell: pwsh
        run: |
          if (-not (Test-Path "product/backend/dist/backend/backend.exe")) {
            Write-Error "PyInstaller build failed - backend.exe not found"
            exit 1
          }
          Write-Host "backend.exe OK"

      - name: Smoke test backend binary
        shell: bash
        run: |
          product/backend/dist/backend/backend.exe 9999 &
          PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9999/health; then
              echo "Smoke test passed!"
              kill $PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Backend did not respond within 30 seconds"
          kill $PID 2>/dev/null || true
          exit 1

      # ── Step 4: Compile Electron + package installer ────────────────────
      - name: Install root npm dependencies
        working-directory: product
        run: npm install

      - name: Compile Electron TypeScript
        working-directory: product
        run: npm run build:electron

      - name: Package with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: product
        run: npx electron-builder --config electron/electron-builder.json --win --publish never

      # ── Upload artifact ────────────────────────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-recruiter-windows-installer
          path: product/release/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # ── Step 1: Build frontend ──────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: product/frontend
        run: npm install

      - name: Build frontend
        working-directory: product/frontend
        run: npm run build

      # ── Step 2: Install backend dependencies ────────────────────────────
      # Embeddings run in the Voyage cloud — no local model to export.
      - name: Install backend dependencies
        working-directory: product/backend
        run: uv sync

      # ── Step 3: Bundle backend with PyInstaller ─────────────────────────
      - name: Bundle backend with PyInstaller
        working-directory: product/backend
        run: uv run pyinstaller open_recruiter.spec --noconfirm

      - name: Verify PyInstaller output
        run: |
          if [ ! -f "product/backend/dist/backend/backend" ]; then
            echo "ERROR: PyInstaller build failed - backend binary not found"
            exit 1
          fi
          echo "backend binary OK"
          file product/backend/dist/backend/backend

      - name: Smoke test backend binary
        run: |
          chmod +x product/backend/dist/backend/backend
          product/backend/dist/backend/backend 9999 &
          PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9999/health; then
              echo "Smoke test passed!"
              kill $PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Backend did not respond within 30 seconds"
          kill $PID 2>/dev/null || true
          exit 1

      # ── Step 4: Compile Electron + package DMG ──────────────────────────
      - name: Install root npm dependencies
        working-directory: product
        run: npm install

      - name: Compile Electron TypeScript
        working-directory: product
        run: npm run build:electron

      - name: Package with electron-builder (sign + notarize)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: product
        run: npx electron-builder --config electron/electron-builder.json --mac --publish never

      # ── Upload artifacts ───────────────────────────────────────────────
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-recruiter-macos-dmg
          path: product/release/*.dmg


  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # ── Step 1: Build frontend ──────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: product/frontend
        run: npm install

      - name: Build frontend
        working-directory: product/frontend
        run: npm run build

      # ── Step 2: Install backend dependencies ────────────────────────────
      # Embeddings run in the Voyage cloud — no local model to export.
      - name: Install backend dependencies
        working-directory: product/backend
        run: uv sync

      # ── Step 3: Bundle backend with PyInstaller ─────────────────────────
      - name: Bundle backend with PyInstaller
        working-directory: product/backend
        run: uv run pyinstaller open_recruiter.spec --noconfirm

      - name: Verify PyInstaller output
        run: |
          if [ ! -f "product/backend/dist/backend/backend" ]; then
            echo "ERROR: PyInstaller build failed - backend binary not found"
            exit 1
          fi
          echo "backend binary OK"
          file product/backend/dist/backend/backend

      - name: Smoke test backend binary
        run: |
          chmod +x product/backend/dist/backend/backend
          product/backend/dist/backend/backend 9999 &
          PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9999/health; then
              echo "Smoke test passed!"
              kill $PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "ERROR: Backend did not respond within 30 seconds"
          kill $PID 2>/dev/null || true
          exit 1

      # ── Step 4: Compile Electron + package AppImage ─────────────────────
      - name: Install root npm dependencies
        working-directory: product
        run: npm install

      - name: Compile Electron TypeScript
        working-directory: product
        run: npm run build:electron

      - name: Package with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: product
        run: npx electron-builder --config electron/electron-builder.json --linux --publish never

      # ── Upload artifact ────────────────────────────────────────────────
      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-recruiter-linux-appimage
          path: product/release/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/open-recruiter-windows-installer/*.exe
            artifacts/open-recruiter-macos-dmg/*.dmg
            artifacts/open-recruiter-linux-appimage/*.AppImage
          generate_release_notes: true
