name: Publish SDK

# GitHub Packages has no Python registry, so a wheel cannot go in the repo's
# Packages panel. It is attached to a Release instead, which is what the
# `pip install <url>` form below reads.
#
#   git tag sdk-core-v0.1.0 && git push origin sdk-core-v0.1.0
#
# The tag's version must match the one in sdk/core/pyproject.toml — the build
# checks, so a mismatch fails before anything is published.

on:
  push:
    tags:
      - "sdk-core-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v4

      - name: Check the tag matches the package version
        id: version
        working-directory: sdk/core
        run: |
          set -euo pipefail
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_NAME#sdk-core-v}" != "$version" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Run the test suite
        working-directory: sdk/core
        run: uv sync && uv run python -m pytest tests/ -q

      - name: Build
        working-directory: sdk/core
        run: uv build --out-dir dist

      # Installing from the repo proves nothing — the wheel is what people get.
      - name: Install the wheel in a clean environment and import it
        working-directory: sdk/core
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          /tmp/venv/bin/python - <<'PY'
          import openrecruiter as orc
          from openrecruiter import Recruiter, Ranker, Tool
          assert orc.__version__, "no version"
          print("imported", orc.__name__, orc.__version__, f"({len(orc.__all__)} public names)")
          PY

      - name: Fail if a training stack crept into the dependencies
        run: |
          if /tmp/venv/bin/pip list --format=freeze | grep -qiE '^(torch|transformers|nvidia-)'; then
            echo "A heavy ML dependency reached the default install" >&2
            /tmp/venv/bin/pip list --format=freeze | grep -iE '^(torch|transformers|nvidia-)'
            exit 1
          fi
          echo "default install is clean"

      - uses: actions/upload-artifact@v4
        with:
          name: openrecruiter-dist
          path: sdk/core/dist/*

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openrecruiter-dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: openrecruiter ${{ needs.build.outputs.version }}
          body: |
            The recruiting engine behind Open Recruiter, as a Python package.

            ```bash
            pip install https://github.com/miao4ai/open_recruiter/releases/download/${{ github.ref_name }}/openrecruiter-${{ needs.build.outputs.version }}-py3-none-any.whl
            ```

            Or straight from the repository:

            ```bash
            pip install "git+https://github.com/miao4ai/open_recruiter.git@${{ github.ref_name }}#subdirectory=sdk/core"
            ```

            See [sdk/core/README.md](https://github.com/miao4ai/open_recruiter/blob/main/sdk/core/README.md).

  # Off until PyPI Trusted Publishing is configured for this repository:
  # https://pypi.org/manage/account/publishing/ — no token is needed once the
  # publisher is registered, which is why this job has no secrets.
  pypi:
    needs: build
    if: github.ref_type == 'tag' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openrecruiter-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
