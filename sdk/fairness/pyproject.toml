[project]
name = "openrecruiter-fairness"
version = "0.0.0"
description = "Fairness-aware candidate ranking for Open Recruiter — a Ranker implementation that measures and reduces unwanted bias."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrecruiter_fairness"]
