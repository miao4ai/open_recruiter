[project]
name = "openrecruiter"
version = "0.0.0"
description = "Agent toolkit behind Open Recruiter — tools, agent loop, and stores for recruiting workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrecruiter"]
