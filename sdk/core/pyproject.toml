[project]
name = "openrecruiter"
version = "0.1.2"
description = "The recruiting engine behind Open Recruiter — parse, retrieve, rank, and an agent over tools."
keywords = ["recruiting", "ats", "llm", "agent", "ranking", "candidate-search"]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Ranking backends that need a local model live in their own distributions
# (recruitgpt, openrecruiter-fairness), so nothing heavy reaches this install.
dependencies = [
    "pydantic>=2.10",
    "litellm>=1.60",
    "httpx>=0.27",
    "chromadb>=0.5",
]

[project.optional-dependencies]
# Embeddings from a local sentence-transformers model instead of an API. Kept
# out of the default install because it pulls the whole torch stack: a package
# that merely offers local embeddings must not make every other install carry
# them. The import is deferred to first use, so nothing loads unless asked.
local-embeddings = ["sentence-transformers>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrecruiter"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
