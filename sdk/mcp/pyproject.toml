[project]
name = "openrecruiter-mcp"
version = "0.2.0"
description = "Open Recruiter as an MCP server — the SDK's recruiting tools, in any MCP client."
keywords = ["mcp", "model-context-protocol", "recruiting", "ats", "claude", "agent"]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# The engine plus the MCP transport, and nothing else: this package is a bridge
# between two things that already exist, so it carries no dependency of its own.
dependencies = [
    "openrecruiter>=0.1.3",
    "mcp>=1.2",
]

[project.scripts]
openrecruiter-mcp = "openrecruiter_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openrecruiter_mcp"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
